plugins {
    id "com.android.application"
}

android {
    namespace "com.kyrn.spartan"
    compileSdk 34

    defaultConfig {
        applicationId "com.kyrn.spartan"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "1.1.0-spartan"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
